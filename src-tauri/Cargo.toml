[package]
name = "biome-generator"
version = "0.1.0"
description = "Procedural low-poly hexagonal biome tiles, exported for 3D printing."
authors = ["Adrian Chrysanthou"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/f00d4tehg0dz/biome-generator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "biome_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
